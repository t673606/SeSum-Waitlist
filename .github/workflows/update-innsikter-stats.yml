name: Update site stats daily

on:
  schedule:
    - cron: '15 6 * * *'   # 06:15 UTC = 08:15 norsk tid, daglig
  workflow_dispatch:        # manuell kjøring via GitHub UI

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update index.html fallback stats
        run: node scripts/update-index-stats.mjs

      - name: Update innsikter.html stats
        run: node scripts/update-innsikter-stats.mjs

      - name: Update kiwi-vs-rema.html prices
        run: node scripts/update-kiwi-vs-rema.mjs

      - name: Update prisportal-matvarer.html stats
        run: node scripts/update-prisportal.mjs

      - name: Generate product pages
        run: node scripts/generate-product-pages.mjs

      - name: Generate tilbud pages
        run: node scripts/generate-tilbud-pages.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-v2.html innsikter.html kiwi-vs-rema.html prisportal-matvarer.html produkt/ tilbud/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update site stats from live data"
            git push
          fi
