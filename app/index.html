<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apne Sesum</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #1a1a1a;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #666; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #3FA989;
      color: white;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sesum</h1>
    <p>Appen er i beta. Har du allerede tilgang burde den ha apnet seg automatisk.</p>
    <a href="https://sesum.no" class="btn">Ga til sesum.no</a>
  </div>
</body>
</html>
