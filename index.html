<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PSY204 muntlig trener</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#/">
          <span class="brand-mark">PSY</span>
          <span>
            <strong>PSY204 muntlig trener</strong>
            <small>Eksamen: tirsdag 26. mai 2026 kl. 15:00</small>
          </span>
        </a>
        <div class="top-actions">
          <button class="tool-button" id="drawTopicBtn" type="button" title="Trekk tilfeldig tema">Trekk tema</button>
          <button class="tool-button" id="printBtn" type="button" title="Skriv ut siden">Skriv ut</button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <div class="search-box">
            <label for="searchInput">Finn tema</label>
            <input id="searchInput" type="search" placeholder="Søk: stress, PTSD, Beck..." autocomplete="off" />
          </div>
          <nav class="nav-list" id="topicNav" aria-label="Temanavigasjon"></nav>
        </aside>

        <main class="content" id="app" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
